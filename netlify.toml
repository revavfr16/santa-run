[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "vite"
  port = 3000
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

# The functions declare their own /api/... paths.
# Everything else is the app, including /crew.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
